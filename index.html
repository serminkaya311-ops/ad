<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders Programım</title>
<style>
  :root{--bg:#040704;--card:#0a120b;--card2:#0e1a10;--line:#1a2f1d;--g:#2cff6b;--g2:#17a346;--txt:#d6ffe0;--mut:#6c9677;--red:#ff5b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
    background-image:radial-gradient(ellipse at 50% -10%,#10321a 0,transparent 55%),linear-gradient(#0000 95%,#2cff6b08 0);background-size:auto,100% 28px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
  h1{margin:0;color:var(--g);font-size:1.8rem;letter-spacing:.5px;text-shadow:0 0 16px #2cff6b66}
  h1 span{animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--mut);font-size:.9rem}
  .stats{display:flex;gap:10px;margin:16px 0}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:1.6rem;color:var(--g);text-shadow:0 0 10px #2cff6b44}
  .stat small{color:var(--mut)}
  .bar{height:7px;background:#07100a;border-radius:5px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g));box-shadow:0 0 10px var(--g);transition:width .4s}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;box-shadow:0 0 30px #00000066}
  h2{margin:0 0 12px;color:var(--g);font-size:1.05rem;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .tools{display:flex;gap:6px}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--card2);color:var(--g);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem;transition:.15s}
  .btn:hover{border-color:var(--g);box-shadow:0 0 10px #2cff6b44}
  .btn.main{background:var(--g);color:#031004;font-weight:700;border-color:var(--g)}
  .scroll{overflow-x:auto;padding-bottom:4px}
  table{border-collapse:separate;border-spacing:5px;width:100%;min-width:760px}
  th{color:var(--g);font-size:.8rem;letter-spacing:1px;padding:6px;text-transform:uppercase}
  th.today{text-shadow:0 0 10px var(--g)}
  td.time{white-space:nowrap;width:1%;vertical-align:middle}
  td.time input{width:68px;font-family:monospace;font-size:.82rem;padding:5px;text-align:center}
  td.time .rm{background:none;border:0;color:var(--mut);padding:0 2px}
  td.time .rm:hover{color:var(--red)}
  td.cell{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:0;height:58px;position:relative;transition:.2s}
  td.cell.today{border-color:#2cff6b55}
  td.cell:focus-within{border-color:var(--g);box-shadow:0 0 12px #2cff6b44}
  td.cell input[type=text]{width:100%;height:100%;background:transparent;border:0;padding:8px 30px 8px 9px;font-size:.92rem;color:var(--txt)}
  td.cell input[type=text]::placeholder{color:#2b4a33}
  td.cell input[type=checkbox]{position:absolute;right:7px;top:50%;margin-top:-10px;width:20px;height:20px;accent-color:var(--g);cursor:pointer}
  td.cell.done{background:#0d2a15;border-color:var(--g2)}
  td.cell.done input[type=text]{color:var(--g);text-decoration:line-through;text-decoration-color:#2cff6b88}
  td.cell.empty input[type=checkbox]{visibility:hidden}
  input,select{background:#050b06;color:var(--txt);border:1px solid var(--line);border-radius:8px;font-family:inherit;outline:none}
  input:focus,select:focus{border-color:var(--g)}
  .qform{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .qform input{padding:9px;font-size:.95rem}
  .qform input[type=number]{width:110px}
  .qform input:first-child{flex:1;min-width:140px}
  .q{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .q.ok{border-color:var(--g2)}
  .q .nm{font-weight:600}
  .q .cnt{font-family:monospace;color:var(--g);font-size:1.1rem;text-align:right}
  .q .bar{grid-column:1/-1;margin:0}
  .q .act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .q .act .btn{padding:4px 10px}
  .q .act .sp{flex:1}
  .muted{color:var(--mut);text-align:center;padding:14px;font-size:.9rem}
  @media(max-width:600px){.stats{flex-direction:column}h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>&gt; Ders Programım<span>_</span></h1><div class="sub" id="date"></div></div>
  </header>

  <div class="stats">
    <div class="stat"><b id="s1">0/0</b><small>İşaretlenen ders</small><div class="bar"><i id="b1"></i></div></div>
    <div class="stat"><b id="s2">0</b><small>Çözülen soru</small><div class="bar"><i id="b2"></i></div></div>
  </div>

  <section>
    <h2>HAFTALIK TABLO
      <span class="tools">
        <button class="btn" id="addRow">+ Saat ekle</button>
        <button class="btn" id="reset">Tikleri sıfırla</button>
      </span>
    </h2>
    <div class="scroll"><table id="tbl"></table></div>
    <div class="sub" style="margin-top:8px">Kutulara ders adını yaz, bittiğinde sağdaki kutucuğu işaretle. Saatleri de değiştirebilirsin.</div>
  </section>

  <section>
    <h2>SORU SAYISI</h2>
    <form class="qform" id="qf">
      <input id="qd" list="dl" placeholder="Ders adı" required>
      <datalist id="dl"></datalist>
      <input id="qh" type="number" min="1" placeholder="Hedef soru" required>
      <button class="btn main">Ekle</button>
    </form>
    <div id="ql"></div>
  </section>
</div>

<script>
const GUN=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let S=load("prog2",null)||{
  rows:["08:30","09:30","10:30","11:30","13:00","14:00","15:00","16:00"].map(t=>({t,c:Array(7).fill(null).map(()=>({n:"",d:false}))}))
};
let Q=load("sorular",[]);
const save=()=>{store("prog2",S);store("sorular",Q)};
const today=(new Date().getDay()+6)%7;
$("date").textContent=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function drawTable(){
  const T=$("tbl");T.innerHTML="";
  const h=T.createTHead().insertRow();h.insertCell().outerHTML="<th></th>";
  GUN.forEach((g,i)=>{const th=document.createElement("th");th.textContent=g;if(i===today)th.className="today";h.append(th)});
  const b=T.createTBody();
  S.rows.forEach((r,ri)=>{
    const tr=b.insertRow();
    const tc=tr.insertCell();tc.className="time";
    const ti=document.createElement("input");ti.type="time";ti.value=r.t;
    ti.onchange=()=>{r.t=ti.value;save()};
    const rm=document.createElement("button");rm.className="rm";rm.textContent="✕";rm.title="Satırı sil";
    rm.onclick=()=>{if(confirm("Bu saat satırı silinsin mi?")){S.rows.splice(ri,1);save();drawTable();stats()}};
    tc.append(ti,rm);
    r.c.forEach((c,ci)=>{
      const td=tr.insertCell();td.className="cell"+(ci===today?" today":"")+(c.d?" done":"")+(c.n?"":" empty");
      const t=document.createElement("input");t.type="text";t.value=c.n;t.placeholder="—";
      t.oninput=()=>{c.n=t.value;if(!t.value){c.d=false;cb.checked=false}td.classList.toggle("empty",!t.value);td.classList.toggle("done",c.d);save();stats();lessons()};
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=c.d;
      cb.onchange=()=>{c.d=cb.checked;td.classList.toggle("done",c.d);save();stats()};
      td.append(t,cb);
    });
  });
}
$("addRow").onclick=()=>{S.rows.push({t:"17:00",c:Array(7).fill(null).map(()=>({n:"",d:false}))});save();drawTable()};
$("reset").onclick=()=>{if(confirm("Tüm işaretler kaldırılsın mı?")){S.rows.forEach(r=>r.c.forEach(c=>c.d=false));save();drawTable();stats()}};

function lessons(){
  const set=new Set();S.rows.forEach(r=>r.c.forEach(c=>c.n.trim()&&set.add(c.n.trim())));
  $("dl").innerHTML="";set.forEach(n=>{const o=document.createElement("option");o.value=n;$("dl").append(o)});
}

function stats(){
  let all=0,done=0;S.rows.forEach(r=>r.c.forEach(c=>{if(c.n.trim()){all++;if(c.d)done++}}));
  $("s1").textContent=done+"/"+all;$("b1").style.width=all?done/all*100+"%":"0";
  const sol=Q.reduce((a,q)=>a+q.s,0),hed=Q.reduce((a,q)=>a+q.h,0);
  $("s2").textContent=sol+(hed?" / "+hed:"");$("b2").style.width=hed?Math.min(100,sol/hed*100)+"%":"0";
}

$("qf").onsubmit=e=>{
  e.preventDefault();
  Q.push({id:Date.now(),n:$("qd").value.trim(),h:+$("qh").value,s:0});
  $("qd").value="";$("qh").value="";save();drawQ();
};
function drawQ(){
  const L=$("ql");L.innerHTML="";
  if(!Q.length)L.innerHTML='<div class="muted">Ders ve hedef soru sayısı ekle, çözdükçe + butonlarına bas.</div>';
  Q.forEach(q=>{
    const d=document.createElement("div");d.className="q"+(q.s>=q.h?" ok":"");
    d.innerHTML='<div class="nm"></div><div class="cnt"></div><div class="bar"><i></i></div><div class="act"></div>';
    d.querySelector(".nm").textContent=q.n;
    d.querySelector(".cnt").textContent=q.s+" / "+q.h;
    d.querySelector(".bar i").style.width=Math.min(100,q.s/q.h*100)+"%";
    const a=d.querySelector(".act");
    [[-10],[-1],[1],[10],[25]].forEach(([v])=>{
      const b=document.createElement("button");b.className="btn";b.textContent=(v>0?"+":"")+v;
      b.onclick=()=>{q.s=Math.max(0,q.s+v);save();drawQ();stats()};a.append(b);
    });
    const sp=document.createElement("span");sp.className="sp";a.append(sp);
    const x=document.createElement("button");x.className="btn";x.textContent="Sil";
    x.onclick=()=>{if(confirm(q.n+" silinsin mi?")){Q=Q.filter(z=>z.id!==q.id);save();drawQ();stats()}};a.append(x);
    L.append(d);
  });
}
drawTable();drawQ();lessons();stats();
</script>
</body>
</html>
